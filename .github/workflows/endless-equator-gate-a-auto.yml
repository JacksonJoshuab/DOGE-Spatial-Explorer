name: Endless Equator Gate A Auto Evidence

on:
  pull_request:
    paths:
      - '.github/workflows/endless-equator-gate-a-auto.yml'
      - 'apps/endless-equator-spatial/Release/collect-gate-a-evidence.mjs'
      - 'apps/endless-equator-spatial/Release/verify-release-evidence.mjs'
      - 'apps/endless-equator-spatial/Release/release-evidence.ci.json'
  workflow_run:
    workflows:
      - Endless Equator Spatial
      - Endless Equator Security
      - Endless Equator Main Xcode 27
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: endless-equator-gate-a-auto-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  validate-definition:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/endless-equator-spatial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate evidence tooling without privileged workflow access
        run: |
          node --check Release/collect-gate-a-evidence.mjs
          node --check Release/verify-release-evidence.mjs
          node --check Release/test-release-evidence.mjs
          node Release/test-release-evidence.mjs

  collect-main-evidence:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
      REQUIRED_GATE_A_WORKFLOWS: |-
        Endless Equator Spatial
        Endless Equator Security
        Endless Equator Main Xcode 27
    steps:
      - name: Check all exact-commit Gate A workflows before checking out code
        id: preflight
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/endless-equator-preflight
          node --input-type=module - <<'NODE' | tee /tmp/endless-equator-preflight/status.json
          import fs from 'node:fs';
          const required = process.env.REQUIRED_GATE_A_WORKFLOWS.split(/\r?\n/).map(v => v.trim()).filter(Boolean);
          const repository = process.env.GITHUB_REPOSITORY;
          const sha = process.env.SOURCE_COMMIT;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            'X-GitHub-Api-Version': '2022-11-28',
            'User-Agent': 'endless-equator-gate-a-preflight'
          };
          const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${repository}/actions/runs?head_sha=${sha}&per_page=100`, { headers });
          if (!response.ok) throw new Error(`GitHub API ${response.status}`);
          const value = await response.json();
          const selected = {};
          for (const name of required) {
            const runs = value.workflow_runs
              .filter(run => run.name === name)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            selected[name] = runs[0] || null;
          }
          const ready = required.every(name => selected[name]?.status === 'completed');
          const allSuccess = ready && required.every(name => selected[name]?.conclusion === 'success');
          const summary = Object.fromEntries(required.map(name => [name, selected[name] ? {
            id: selected[name].id,
            number: selected[name].run_number,
            status: selected[name].status,
            conclusion: selected[name].conclusion,
            url: selected[name].html_url
          } : null]));
          console.log(JSON.stringify({ repository, sha, ready, allSuccess, workflows: summary }, null, 2));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `ready=${ready}\nall_success=${allSuccess}\n`);
          NODE

      - name: Stop cleanly until the final required workflow finishes
        if: steps.preflight.outputs.ready != 'true'
        run: echo 'Another exact-commit Gate A workflow is still pending; a later trusted main workflow_run event will collect the evidence.'

      - uses: actions/checkout@v4
        if: steps.preflight.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.ready == 'true'
        with:
          node-version: '22'

      - name: Confirm immutable checkout matches the trusted main push event
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Collect workflow metadata logs and artifact hashes
        if: steps.preflight.outputs.ready == 'true'
        id: collect
        continue-on-error: true
        working-directory: apps/endless-equator-spatial
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAX_GATE_A_ARTIFACT_BYTES: '300000000'
        run: |
          set -o pipefail
          mkdir -p Build/RC1
          node Release/collect-gate-a-evidence.mjs \
            "$SOURCE_COMMIT" \
            Build/RC1/release-evidence.gate-a.json | tee Build/RC1/gate-a-collector-summary.json

      - name: Validate generated fail-closed evidence index
        if: steps.preflight.outputs.ready == 'true' && hashFiles('apps/endless-equator-spatial/Build/RC1/release-evidence.gate-a.json') != ''
        working-directory: apps/endless-equator-spatial
        run: |
          set -o pipefail
          node Release/verify-release-evidence.mjs \
            Build/RC1/release-evidence.gate-a.json \
            "$SOURCE_COMMIT" | tee Build/RC1/release-evidence-validation.json

      - name: Hash complete evidence package
        if: steps.preflight.outputs.ready == 'true' && always()
        working-directory: apps/endless-equator-spatial
        run: |
          mkdir -p Build/RC1
          cp /tmp/endless-equator-preflight/status.json Build/RC1/exact-commit-workflow-preflight.json
          find Build/RC1 -type f -print0 | sort -z | xargs -0 shasum -a 256 > Build/RC1/SHA256SUMS.txt || true
          cat Build/RC1/SHA256SUMS.txt || true

      - name: Upload exact-main Gate A package
        if: steps.preflight.outputs.ready == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: Endless_Equator_Gate_A_Auto_${{ github.event.workflow_run.head_sha }}
          path: apps/endless-equator-spatial/Build/RC1
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Enforce Gate A result
        if: steps.preflight.outputs.ready == 'true' && always()
        shell: bash
        env:
          ALL_SUCCESS: ${{ steps.preflight.outputs.all_success }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          set -euo pipefail
          test "$ALL_SUCCESS" = 'true'
          test "$COLLECT_OUTCOME" = 'success'
