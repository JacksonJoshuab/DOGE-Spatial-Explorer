name: Endless Equator Spatial
on:
  pull_request:
    paths:
      - 'apps/endless-equator-spatial/**'
  push:
    branches: [main]
    paths:
      - 'apps/endless-equator-spatial/**'
permissions:
  contents: read
jobs:
  server-and-data:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/endless-equator-spatial
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate canonical JSON
        run: |
          node -e "for (const f of ['areas-01.json','areas-02.json','areas-03.json']) JSON.parse(require('fs').readFileSync('Sources/EndlessEquatorCore/Resources/'+f))"
          node -e "JSON.parse(require('fs').readFileSync('Sources/EndlessEquatorCore/Resources/route-plan.json'))"
          node -e "JSON.parse(require('fs').readFileSync('Sources/EndlessEquatorCore/Resources/route.geojson'))"
      - name: Check server syntax
        run: node --check Server/server.mjs
      - name: Smoke-test server
        run: |
          node Server/server.mjs > /tmp/endless-equator.log 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          sleep 2
          curl --fail http://localhost:8787/health
          curl --fail http://localhost:8787/api/areas >/dev/null
          curl --fail http://localhost:8787/api/route >/dev/null
      - name: Verify no obvious committed secrets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          patterns = [re.compile(r"sk-proj-[A-Za-z0-9_-]{20,}"), re.compile(r"-----BEGIN PRIVATE KEY-----"), re.compile(r"OPENAI_API_KEY=\S+")]
          violations=[]
          for path in Path('.').rglob('*'):
              if not path.is_file() or path.name == '.env.example' or '.git' in path.parts:
                  continue
              if path.as_posix().endswith('.github/workflows/endless-equator-spatial.yml'):
                  continue
              try: text=path.read_text(errors='ignore')
              except OSError: continue
              if any(pattern.search(text) for pattern in patterns): violations.append(str(path))
          if violations: raise SystemExit('Potential committed secrets: ' + ', '.join(violations))
          PY
  apple-source-syntax:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/endless-equator-spatial
    steps:
      - uses: actions/checkout@v4
      - name: Report Apple toolchain
        run: swift --version
      - name: Parse Swift source files
        run: |
          find Sources AppTemplates Tests -name '*.swift' -print0 | while IFS= read -r -d '' file; do
            swiftc -frontend -parse "$file"
          done
      - name: Validate package manifest on Swift 6.4+
        run: |
          python3 - <<'PY'
          import re, subprocess
          text=subprocess.check_output(['swift','--version'],text=True)
          m=re.search(r'Swift version (\d+)\.(\d+)',text)
          if m and (int(m.group(1)),int(m.group(2))) >= (6,4):
              subprocess.check_call(['swift','package','dump-package'])
          else:
              print('Manifest requires Swift 6.4/Xcode 27; source parsing completed on the available runner.')
          PY
