name: Endless Equator Xcode 27

on:
  pull_request:
    paths:
      - 'apps/endless-equator-spatial/**'
      - '.github/workflows/endless-equator-xcode-27.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: endless-equator-xcode-27-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  xcode-27-build:
    runs-on: xcode-27
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/endless-equator-spatial
    steps:
      - uses: actions/checkout@v4

      - name: Report toolchain and simulators
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          xcrun simctl list devices available

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          arch -arm64 brew install xcodegen
          xcodegen --version

      - name: Generate reproducible Xcode project
        run: |
          set -euo pipefail
          mkdir -p Build
          xcodegen generate --spec project.yml
          xcodebuild -project EndlessEquator.xcodeproj -list

      - name: Resolve pinned Swift packages
        run: |
          set -euo pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project EndlessEquator.xcodeproj \
            -scheme EndlessEquatorCompanion

      - name: Build iPhone and iPad companion plus UI test bundle
        id: ios_build
        run: |
          set -euo pipefail
          xcodebuild \
            -project EndlessEquator.xcodeproj \
            -scheme EndlessEquatorCompanion \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=27.0' \
            -derivedDataPath Build/DerivedData-iOS \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build-for-testing | tee Build/iOS-build.log | xcbeautify

      - name: Boot iPhone simulator and launch built app
        if: always() && steps.ios_build.outcome == 'success'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for xs in d["devices"].values() for x in xs if x["name"]=="iPhone 17 Pro" and x.get("isAvailable")))')"
          APP_PATH="$(find Build/DerivedData-iOS/Build/Products -type d -name 'Endless Equator.app' -print -quit)"
          test -n "$UDID"
          test -n "$APP_PATH"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          trap 'xcrun simctl shutdown "$UDID" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP_PATH"
          LAUNCH_OUTPUT="$(xcrun simctl launch --terminate-running-process "$UDID" "$BUNDLE_ID" --ui-testing)"
          printf '%s\n' "$LAUNCH_OUTPUT" | tee Build/iPhone-launch.log
          printf '%s\n' "$LAUNCH_OUTPUT" | grep -Eq ':[[:space:]]*[0-9]+$'
          xcrun simctl terminate "$UDID" "$BUNDLE_ID"

      - name: Build iPad support console
        if: always()
        run: |
          set -euo pipefail
          xcodebuild \
            -project EndlessEquator.xcodeproj \
            -scheme EndlessEquatorCompanion \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M5),OS=27.0' \
            -derivedDataPath Build/DerivedData-iPad \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee Build/iPad-build.log | xcbeautify

      - name: Build Vision Pro stationary route room
        if: always()
        run: |
          set -euo pipefail
          xcodebuild \
            -project EndlessEquator.xcodeproj \
            -scheme EndlessEquatorVision \
            -configuration Debug \
            -destination 'platform=visionOS Simulator,name=Apple Vision Pro,OS=27.0' \
            -derivedDataPath Build/DerivedData-visionOS \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee Build/visionOS-build.log | xcbeautify

      - name: Run static analyzer
        if: always()
        run: |
          set -euo pipefail
          xcodebuild \
            -project EndlessEquator.xcodeproj \
            -scheme EndlessEquatorCompanion \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath Build/DerivedData-analyze \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            analyze | tee Build/analyze.log | xcbeautify

      - name: Create unsigned release archives
        if: always()
        run: |
          set -euo pipefail
          xcodebuild \
            -project EndlessEquator.xcodeproj \
            -scheme EndlessEquatorCompanion \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath Build/EndlessEquatorCompanion.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive | tee Build/iOS-archive.log | xcbeautify
          xcodebuild \
            -project EndlessEquator.xcodeproj \
            -scheme EndlessEquatorVision \
            -configuration Release \
            -destination 'generic/platform=visionOS' \
            -archivePath Build/EndlessEquatorVision.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive | tee Build/visionOS-archive.log | xcbeautify

      - name: Upload Xcode diagnostics and unsigned archives
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Endless_Equator_Xcode_27_Diagnostics
          path: |
            apps/endless-equator-spatial/Build/*.log
            apps/endless-equator-spatial/Build/*.xcresult
            apps/endless-equator-spatial/Build/*.xcarchive
            apps/endless-equator-spatial/EndlessEquator.xcodeproj
          if-no-files-found: warn
          retention-days: 30
