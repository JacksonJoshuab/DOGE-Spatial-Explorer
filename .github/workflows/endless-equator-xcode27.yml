name: Endless Equator Signed Archives

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 'Type SIGN to authorize protected Apple archive creation'
        required: true
        type: string

permissions:
  contents: read

jobs:
  signed-archives:
    name: Protected signed iOS iPadOS visionOS archives
    if: inputs.confirm_release == 'SIGN'
    runs-on: [self-hosted, macOS, xcode27, endless-equator-signing]
    timeout-minutes: 60
    environment: apple-production
    defaults:
      run:
        working-directory: apps/endless-equator-spatial
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ENDLESS_EQUATOR_IOS_BUNDLE_ID: ${{ vars.ENDLESS_EQUATOR_IOS_BUNDLE_ID }}
      ENDLESS_EQUATOR_VISION_BUNDLE_ID: ${{ vars.ENDLESS_EQUATOR_VISION_BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Require protected signing inputs
        run: |
          set -euo pipefail
          test -n "$APPLE_TEAM_ID"
          test -n "$ENDLESS_EQUATOR_IOS_BUNDLE_ID"
          test -n "$ENDLESS_EQUATOR_VISION_BUNDLE_ID"
          security find-identity -v -p codesigning

      - name: Verify Xcode 27 and generate project
        run: |
          set -euo pipefail
          xcodebuild -version | tee /tmp/xcode-version.txt
          grep -Eq '^Xcode 27([. ]|$)' /tmp/xcode-version.txt
          swift --version
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate --spec project.yml

      - name: Archive iOS and iPadOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project EndlessEquator.xcodeproj \
            -scheme EndlessEquatorCompanion \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/EndlessEquatorCompanion.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$ENDLESS_EQUATOR_IOS_BUNDLE_ID" \
            clean archive | tee "$RUNNER_TEMP/endless-equator-signed-ios.log"

      - name: Archive visionOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project EndlessEquator.xcodeproj \
            -scheme EndlessEquatorVision \
            -configuration Release \
            -destination 'generic/platform=visionOS' \
            -archivePath "$RUNNER_TEMP/EndlessEquatorVision.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$ENDLESS_EQUATOR_VISION_BUNDLE_ID" \
            clean archive | tee "$RUNNER_TEMP/endless-equator-signed-vision.log"

      - name: Verify signatures and WeatherKit entitlements
        run: |
          set -euo pipefail
          IOS_APP="$RUNNER_TEMP/EndlessEquatorCompanion.xcarchive/Products/Applications/Endless Equator.app"
          VISION_APP="$RUNNER_TEMP/EndlessEquatorVision.xcarchive/Products/Applications/Endless Equator Spatial.app"

          for app in "$IOS_APP" "$VISION_APP"; do
            test -d "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -d --entitlements :- "$app" > "$RUNNER_TEMP/$(basename "$app" | tr ' ' '_').entitlements.plist" 2>/dev/null
            /usr/libexec/PlistBuddy -c 'Print :com.apple.developer.weatherkit' "$RUNNER_TEMP/$(basename "$app" | tr ' ' '_').entitlements.plist" | grep -q true

            profile="$app/embedded.mobileprovision"
            test -f "$profile"
            security cms -D -i "$profile" > "$RUNNER_TEMP/$(basename "$app" | tr ' ' '_').profile.plist"
            /usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.weatherkit' "$RUNNER_TEMP/$(basename "$app" | tr ' ' '_').profile.plist" | grep -q true
          done

      - name: Upload protected release evidence
        uses: actions/upload-artifact@v4
        with:
          name: endless-equator-signed-archives
          path: |
            ${{ runner.temp }}/EndlessEquatorCompanion.xcarchive
            ${{ runner.temp }}/EndlessEquatorVision.xcarchive
            ${{ runner.temp }}/endless-equator-signed-*.log
            ${{ runner.temp }}/*.entitlements.plist
            ${{ runner.temp }}/*.profile.plist
          retention-days: 7
