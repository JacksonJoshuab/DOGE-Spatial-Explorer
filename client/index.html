<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Apple-native viewport: viewport-fit=cover enables safe-area-inset CSS env() variables -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />

    <!-- ── Apple Web App ── -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DOGE-Landscaper" />
    <link rel="apple-touch-icon" href="/favicon.ico" />

    <!-- ── visionOS / tvOS / iPadOS ── -->
    <!-- Allows visionOS to render as a spatial window -->
    <meta name="apple-mobile-web-app-orientations" content="portrait landscape" />

    <!-- ── Theme ── -->
    <meta name="theme-color" content="#0a0e1a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#0a0e1a" />
    <meta name="color-scheme" content="dark" />

    <!-- ── SEO ── -->
    <title>DOGE-Landscaper — Chip McHaymaker | West Liberty, IA</title>
    <meta name="description" content="Humanoid Robot Groundskeeper POV Interface — 905 N Columbus St, West Liberty, Iowa. LiDAR digital twin, fleet connectivity, and AI-powered lawn care. Powered by Nvidia Jetson Orin + Apple Liquid Glass." />
    <meta name="keywords" content="robot, lawn care, LiDAR, digital twin, DOGE, West Liberty Iowa, humanoid robot, fleet, drone, visionOS" />

    <!-- ── Open Graph ── -->
    <meta property="og:title" content="DOGE-Landscaper — Chip McHaymaker" />
    <meta property="og:description" content="Humanoid robot groundskeeper POV command interface with LiDAR digital twin, fleet connectivity, and real-time asset registry." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://d2xsxph8kpxj0f.cloudfront.net/116029439/cao3qXUUr9zrMdetSxxjdj/backyard-final_93fbdb48.glb" />

    <!-- ── Preconnect for CDN assets ── -->
    <link rel="preconnect" href="https://d2xsxph8kpxj0f.cloudfront.net" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ── Typography: Space Grotesk for headings, JetBrains Mono for telemetry ── -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

    <!-- ── Web App Manifest ── -->
    <link rel="manifest" href="/manifest.json" />

    <style>
      /* Critical: prevent flash of unstyled content on iOS */
      html, body, #root {
        height: 100%;
        background: #0a0e1a;
        overflow: hidden;
      }
      /* Prevent iOS rubber-band scroll on the root */
      body {
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
