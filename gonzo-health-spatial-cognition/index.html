    :root{color-scheme:dark;background:#030816;color:#f8fbff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));background:radial-gradient(circle at 18% 12%,rgba(75,134,255,.25),transparent 34%),radial-gradient(circle at 82% 18%,rgba(181,104,255,.2),transparent 36%),#030816}
